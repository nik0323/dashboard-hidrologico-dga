# Límites normativos de calidad de agua para el módulo "Normas de Calidad".
#
# ADVERTENCIA: los valores fueron precargados de memoria por el asistente y NO están verificados.
# Antes de usarlos en un informe, contrastar cada límite con el texto oficial vigente de la norma
# (INN) y cambiar `verificado = true`. La app muestra un aviso mientras haya límites sin verificar.
#
# Campos de [[limite]]:
#   norma           clave de una [[norma]]
#   parametro       nombre del parámetro en la norma
#   parametros_dga  nombres exactos en la columna PARAMETRO de la DGA ([] = la DGA no lo informa)
#   unidad_dga      primer término de la columna UNIDAD de la DGA, en minúsculas ("mg/l", "unid.")
#   maximo/minimo   límites (al menos uno)
#   nota            observación que se muestra junto al resultado

[[norma]]
clave = "nch409"
nombre = "NCh 409/1 — Agua potable"
fuente = "NCh 409/1 Of. 2005 (verificar versión vigente y tablas de requisitos químicos)"

[[norma]]
clave = "nch1333_riego"
nombre = "NCh 1333 — Agua para riego"
fuente = "NCh 1333 Of. 1978, mod. 1987 (verificar tabla de requisitos químicos para riego)"

