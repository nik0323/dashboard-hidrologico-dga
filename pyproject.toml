[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hidro"
version = "0.1.0"
description = "Plataforma de análisis hidrológico e hidrogeológico con datos DGA (Chile)"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.15.1",
    "plotly==6.0.0",
    "streamlit==1.63.0",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]
